<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>美股分析系统（前后端版）</title>
  <style>
    body { margin: 0; font-family: "PingFang SC", "Microsoft Yahei", sans-serif; background: #f3f6fb; color: #102243; }
    .layout { display: grid; grid-template-columns: 320px 1fr; min-height: 100vh; }
    .sidebar { border-right: 1px solid #dbe4f2; background: #eef3fd; padding: 18px; }
    .main { padding: 28px; }
    .card { margin-top: 16px; background: #fff; border: 1px solid #dbe4f2; border-radius: 14px; padding: 18px; }
    .field { margin-bottom: 14px; }
    label { display: block; margin-bottom: 6px; color: #5e6b84; font-size: 13px; }
    input { width: 100%; border: 1px solid #c5d3ea; border-radius: 10px; padding: 10px 12px; font-size: 14px; }
    .btn { border: 0; border-radius: 10px; padding: 10px 16px; background: #1a73e8; color: #fff; font-size: 14px; cursor: pointer; }
    .btn:disabled { background: #89ace4; cursor: not-allowed; }
    .status { margin-top: 12px; min-height: 20px; font-size: 13px; }
    .status.ok { color: #0b8a44; }
    .status.err { color: #c62828; }
    .history-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
    .history-item { border: 1px solid #dbe4f2; border-radius: 10px; padding: 10px; background: #fff; cursor: pointer; }
    .muted { color: #5e6b84; font-size: 13px; }
    .empty { color: #5e6b84; font-size: 13px; border: 1px dashed #c5d3ea; border-radius: 10px; background: #fff; padding: 12px; }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <h3>历史分析（后端存储）</h3>
      <ul id="historyList" class="history-list"></ul>
      <div id="emptyState" class="empty">暂无记录，提交分析后会显示在这里。</div>
    </aside>

    <main class="main">
      <h1>美股分析系统</h1>
      <p class="muted">前端只提交股票名称与代码；Gemini 调用和结果存储都在后台完成。</p>

      <section class="card">
        <div class="field">
          <label for="stockName">股票名称</label>
          <input id="stockName" type="text" placeholder="例如：Apple" />
        </div>

        <div class="field">
          <label for="stockCode">股票代码</label>
          <input id="stockCode" type="text" placeholder="例如：AAPL" />
        </div>

        <button id="analyzeBtn" class="btn" type="button">提交后台分析</button>
        <div id="status" class="status"></div>
      </section>
    </main>
  </div>

  <script>
    const historyListEl = document.getElementById('historyList');
    const emptyStateEl = document.getElementById('emptyState');
    const stockNameEl = document.getElementById('stockName');
    const stockCodeEl = document.getElementById('stockCode');
    const analyzeBtn = document.getElementById('analyzeBtn');
    const statusEl = document.getElementById('status');

    analyzeBtn.addEventListener('click', submitAnalyze);
    loadHistory();

    function setStatus(message, type) {
      statusEl.textContent = message || '';
      statusEl.className = `status ${type || ''}`;
    }

    async function loadHistory() {
      try {
        const res = await fetch('/api/analyses');
        const items = await res.json();
        historyListEl.innerHTML = '';
        emptyStateEl.style.display = items.length ? 'none' : 'block';

        items.forEach((item) => {
          const li = document.createElement('li');
          li.className = 'history-item';
          li.innerHTML = `<div><strong>${escapeHtml(item.stock_name)}</strong> (${escapeHtml(item.stock_code)})</div><div class="muted">${new Date(item.created_at).toLocaleString()}</div>`;
          li.addEventListener('click', () => window.open(`/ai-stock-result.html?id=${item.id}`, '_blank'));
          historyListEl.appendChild(li);
        });
      } catch (err) {
        setStatus(`加载历史失败：${err.message}`, 'err');
      }
    }

    async function submitAnalyze() {
      const stockName = stockNameEl.value.trim();
      const stockCode = stockCodeEl.value.trim().toUpperCase();
      if (!stockName || !stockCode) {
        setStatus('请填写股票名称和代码。', 'err');
        return;
      }

      analyzeBtn.disabled = true;
      setStatus('后台分析中，请稍候...', '');

      try {
        const res = await fetch('/api/analyze', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ stockName, stockCode })
        });
        const data = await res.json();
        if (!res.ok) {
          throw new Error(data.error || `HTTP ${res.status}`);
        }

        setStatus('分析完成，正在打开结果页。', 'ok');
        await loadHistory();
        window.open(`/ai-stock-result.html?id=${data.id}`, '_blank');
      } catch (err) {
        setStatus(`分析失败：${err.message}`, 'err');
      } finally {
        analyzeBtn.disabled = false;
      }
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }
  </script>
</body>
</html>
